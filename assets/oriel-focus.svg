<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Oriel focus and gentle reminders preview</title><desc id="desc">An Oriel-styled focus timer, a tidy task list and a soft water reminder, illustrated as standalone cards.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#191a45"/><stop offset=".6" stop-color="#303886"/><stop offset="1" stop-color="#414caf"/></linearGradient><linearGradient id="ring" x1="0" x2="1"><stop stop-color="#ff988e"/><stop offset="1" stop-color="#ffc07e"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#08091f" flood-opacity=".3"/></filter></defs>
<rect width="1000" height="560" rx="36" fill="url(#bg)"/>
<text x="64" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#c4ceff">GENTLE MOMENTUM, YOUR WAY</text>
<g filter="url(#shadow)"><rect x="54" y="112" width="430" height="384" rx="28" fill="#f6f7ff"/><rect x="514" y="112" width="432" height="384" rx="28" fill="#20234f" stroke="#7781df" stroke-opacity=".35"/>
<text x="90" y="162" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#646eb9">FOCUS SESSION</text>
<circle cx="269" cy="306" r="99" fill="none" stroke="#e6e8f5" stroke-width="15"/><circle cx="269" cy="306" r="99" fill="none" stroke="url(#ring)" stroke-width="15" stroke-linecap="round" stroke-dasharray="445 622" transform="rotate(-90 269 306)"/>
<text x="269" y="302" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="700" fill="#272b66">25:00</text><text x="269" y="334" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#7b80a9">TIME FOR ONE THING</text>
<rect x="132" y="438" width="274" height="40" rx="20" fill="#6c78ef"/><text x="269" y="464" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Begin a focus session</text>
<text x="550" y="162" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#bfcaff">YOUR LITTLE CHECKLIST</text>
<circle cx="565" cy="219" r="10" fill="#7182ed"/><path d="m560 219 4 4 7-9" fill="none" stroke="#fff" stroke-width="2.5"/><text x="591" y="225" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#d8dcf7">Clear one small task</text><path d="M591 235h285" stroke="#474a79"/>
<circle cx="565" cy="278" r="10" fill="none" stroke="#737cb8" stroke-width="2"/><text x="591" y="284" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#d8dcf7">Take a breath between tasks</text><path d="M591 294h285" stroke="#474a79"/>
<rect x="550" y="329" width="360" height="118" rx="20" fill="#30356e"/><circle cx="590" cy="388" r="22" fill="#4760bd"/><path d="M590 373c-8 11-12 17-12 22a12 12 0 0 0 24 0c0-5-4-11-12-22z" fill="#c7ddff"/><text x="628" y="382" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">A sip of water?</text><text x="628" y="410" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#b5bce9">A gentle nudge when it's time.</text>
</g>
<text x="500" y="532" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#c3cafa">Small goals, soft reminders, and progress you can feel.</text>
</svg>
