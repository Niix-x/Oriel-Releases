<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Oriel music and lyrics preview</title><desc id="desc">A designed music player and synced lyrics card in Oriel's indigo, blue and lavender palette.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17193e"/><stop offset="1" stop-color="#353d98"/></linearGradient><linearGradient id="art" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8ebaff"/><stop offset=".53" stop-color="#777aff"/><stop offset="1" stop-color="#ca8de8"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#08091f" flood-opacity=".35"/></filter></defs>
<rect width="1000" height="560" rx="36" fill="url(#bg)"/>
<text x="64" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#becaff">MUSIC, WITH ROOM FOR THE WORDS</text>
<g filter="url(#shadow)"><rect x="54" y="112" width="892" height="384" rx="28" fill="#111321" stroke="#7781df" stroke-opacity=".35"/>
<rect x="82" y="145" width="248" height="248" rx="24" fill="url(#art)"/><circle cx="205" cy="269" r="78" fill="#141633" opacity=".24"/><path d="M208 214v95a35 35 0 1 1-16-29v-78l89-20v91a35 35 0 1 1-16-29v-83z" fill="#fff" opacity=".92"/>
<text x="82" y="433" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#8590d4">NOW PLAYING</text><text x="82" y="464" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">From your favorite app</text>
<text x="380" y="170" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#8994db">SYNCED LYRICS</text>
<text x="380" y="232" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#a6acd0">Let the melody carry you</text><text x="380" y="284" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#fff">Follow every line in time</text><text x="380" y="336" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#a6acd0">A little space to just listen</text>
<rect x="380" y="388" width="520" height="6" rx="3" fill="#383b5b"/><rect x="380" y="388" width="236" height="6" rx="3" fill="#809bff"/><circle cx="616" cy="391" r="8" fill="#fff"/>
<g fill="#dce4ff"><path d="M565 430v28l-21-14z"/><circle cx="638" cy="444" r="24"/><path d="M632 432v24l19-12z" fill="#34376f"/><path d="M705 430v28l21-14z"/></g>
</g>
<text x="500" y="532" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#c3cafa">Playback and lyrics together, all in one calm little card.</text>
</svg>
